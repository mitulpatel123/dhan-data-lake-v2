services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dhan_lake}
      POSTGRES_USER: ${POSTGRES_USER:-dhan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dhan} -d ${POSTGRES_DB:-dhan_lake}"]
      interval: 3s
      timeout: 3s
      retries: 20

  loader:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dhan:local_only_change_me@postgres:5432/dhan_lake}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--input", "/app/data/sample/market_bars.csv", "--init-db"]

volumes:
  postgres_data:
